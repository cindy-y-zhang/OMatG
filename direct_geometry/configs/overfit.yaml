# The memorisation check: can this architecture drive a hundred structures to a high match rate at all?
#
# A negative result on a real split has two explanations -- the feature carries nothing, or the architecture cannot fit -- and
# they call for opposite next steps. This separates them. The validation split is the training split, so a low match rate
# here is an optimisation failure and nothing else, and an arm that cannot reach 80 per cent is disqualified before its
# performance on unseen structures is allowed to mean anything.
#
# It is emphatically not a generalisation measurement. Nothing from this configuration goes into a gate that compares arms.
#
# WHY THE BUDGET AND THE SAMPLER ARE WHAT THEY ARE
#
# The first version of this check ran 10,000 optimizer steps and validated with a 50-step sampler, and every arm landed
# between 46 and 56 per cent against the 80 per cent floor -- including arm A, which is the baseline code path with every
# addition zeroed. A floor the reference implementation cannot clear is not measuring the arms, and the two candidate causes
# were both properties of the check rather than of any arm:
#
#   - the budget ended while the curve was still climbing. Arm A went 3 per cent to 53 per cent across the 2,500 epochs and
#     never plateaued, so the run was stopped mid-ascent and the number read off was wherever it happened to be.
#   - it sampled at 50 integration steps. The 26.82 per cent figure this project compares everything against is measured at
#     210, and a coarser Euler discretisation caps the achievable match rate on its own. Grading a memorisation check with a
#     sampler four times cheaper than the reported one confounds "cannot fit" with "was not integrated finely enough".
#
# So the budget is four times longer and the sampler is the production one. The 80 per cent floor itself is untouched: the
# check was repaired, not the bar, because a threshold moved to accommodate the result it was meant to test is not a
# threshold. The superseded runs are kept under direct_geometry/superseded/ rather than deleted, since they are the evidence
# for this paragraph.
#
# If an arm still lands near 50 per cent with a converged curve and the production sampler, that is a real finding about this
# probability path and not a miscalibration: it would mean a marginal-velocity flow model cannot reproduce individual
# memorised targets from a random start, which is worth knowing before any of it is read as a statement about features.

data:
  batch_size: 25
  num_workers: 2
  persistent_workers: true
  prefetch_factor: 2

model:
  si:
    init_args:
      # The production sampling budget, so a shortfall here cannot be discretisation error.
      integration_time_steps: 210
  number_cpus: 4

trainer:
  # 40,000 optimizer steps: a hundred structures at batch 25 is four steps an epoch, with no accumulation.
  max_epochs: 10000
  accumulate_grad_batches: 1
  max_time:
    hours: 6
  # Twenty points on the curve, which is what makes "still climbing" distinguishable from "plateaued" -- the question the
  # longer budget was added to answer.
  check_val_every_n_epoch: 500
  enable_progress_bar: false
