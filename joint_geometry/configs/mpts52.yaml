# Joint CN-RDF state on the established MPTS-52 atomwise CSP task.

seed_everything: 0

model:
  si:
    class_path: omg.si.stochastic_interpolants.StochasticInterpolants
    init_args:
      stochastic_interpolants:
        - class_path: omg.si.single_stochastic_interpolant_identity.SingleStochasticInterpolantIdentity
        - class_path: omg.si.single_stochastic_interpolant.SingleStochasticInterpolant
          init_args:
            interpolant: omg.si.interpolants.PeriodicLinearInterpolant
            gamma: null
            epsilon: null
            differential_equation_type: "ODE"
            integrator_kwargs:
              method: "euler"
            velocity_annealing_factor: 10.182659004291072
            correct_center_of_mass_motion: true
        - class_path: omg.si.single_stochastic_interpolant.SingleStochasticInterpolant
          init_args:
            interpolant: omg.si.interpolants.LinearInterpolant
            gamma: null
            epsilon: null
            differential_equation_type: "ODE"
            integrator_kwargs:
              method: "euler"
            velocity_annealing_factor: 1.824475401606087
            correct_center_of_mass_motion: false
        - class_path: omg.si.single_stochastic_interpolant.SingleStochasticInterpolant
          init_args:
            interpolant: omg.si.interpolants.LinearInterpolant
            gamma: null
            epsilon: null
            differential_equation_type: "ODE"
            integrator_kwargs:
              method: "euler"
            velocity_annealing_factor: 0.0
            correct_center_of_mass_motion: false
      data_fields:
        - "species"
        - "pos"
        - "cell"
        - "geometry"
      integration_time_steps: 210
  relative_si_costs:
    species_loss: 0.0
    pos_loss_b: 0.9994149341846618
    cell_loss_b: 0.0005850658153382233
    geometry_loss_b: 0.0
  sampler:
    class_path: joint_geometry.sampler.JointGeometrySampler
    init_args:
      geometry_dimension: 17
      structural_sampler:
        class_path: omg.sampler.IndependentSampler
        init_args:
          pos_distribution:
            class_path: omg.sampler.position_distributions.UniformPositionDistribution
          cell_distribution:
            class_path: omg.sampler.cell_distributions.InformedLatticeDistribution
            init_args:
              dataset_name: mpts_52
          species_distribution:
            class_path: omg.sampler.species_distributions.MirrorSpecies
  model:
    class_path: omg.model.model.Model
    init_args:
      encoder:
        class_path: joint_geometry.encoder.JointGeometryCSPNet
        init_args:
          geometry_dimension: 17
          geometry_input: true
          feature_mode: none
          message_graph: fc
      head:
        class_path: omg.model.heads.pass_through.PassThrough
      time_embedder:
        class_path: omg.model.model_utils.SinusoidalTimeEmbeddings
        init_args:
          dim: 256
  geometry_weight: null
  use_min_perm_dist: false
  float_32_matmul_precision: high
  validation_mode: match_rate
  dataset_name: mpts_52
  number_cpus: 8

data:
  train_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: omg/data/mpts_52/train.lmdb
      lazy_storage: true
      niggli_reduce: false
  val_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: omg/data/mpts_52/val.lmdb
      lazy_storage: true
      niggli_reduce: false
  pred_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: omg/data/mpts_52/test.lmdb
      lazy_storage: true
      niggli_reduce: false
  geometry_dir: joint_geometry/artifacts/mpts_52/radial17
  shuffle_within_element: false
  shuffle_seed: 0
  batch_size: 256
  num_workers: 6
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4

trainer:
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: joint_geometry/runs/full/J_seed0
      name: ""
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: best_match_rate
        save_top_k: 1
        monitor: match_rate
        mode: max
        save_weights_only: false
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: last
        save_top_k: 1
        every_n_epochs: 25
        save_weights_only: false
  accumulate_grad_batches: 4
  gradient_clip_val: 0.5
  num_sanity_val_steps: 0
  precision: 32-true
  max_epochs: 1200
  max_time:
    hours: 36
  check_val_every_n_epoch: 25
  enable_progress_bar: true

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0006689636445843722
