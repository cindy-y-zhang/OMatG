# R: descriptor recomputed from the current noisy structure, not carried.
# Overlay on atomwise_mpts52.yaml and direct_geometry/configs/encoder.yaml.
model:
  model:
    init_args:
      encoder:
        class_path: direct_geometry.encoder.DirectGeometryCSPNet
        init_args:
          feature_mode: radial
          message_graph: fc

trainer:
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: joint_geometry/runs/full/R_seed0
      name: ""
