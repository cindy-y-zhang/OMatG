# RTX PRO 6000 screen overlay. Screening evidence only.

data:
  batch_size: 256
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 4

model:
  number_cpus: 8

trainer:
  accumulate_grad_batches: 4
  precision: 32-true
  gradient_clip_val: 0.5
  num_sanity_val_steps: 0
  max_epochs: 1000
  max_steps: 2000
  max_time:
    hours: 20
  enable_progress_bar: false
