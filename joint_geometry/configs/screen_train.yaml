# Training-only screen: save a final checkpoint and defer expensive CSP sampling.

model:
  validation_mode: loss

trainer:
  enable_checkpointing: false
  callbacks:
    - class_path: joint_geometry.checkpoint.LoadBackboneCheckpoint
      init_args:
        checkpoint_path: cgfm/centre_runs/atomwise/checkpoints/best_match_rate.ckpt
    - class_path: joint_geometry.checkpoint.FinalCheckpoint
    - class_path: joint_geometry.checkpoint.ResourceMetrics
      init_args:
        filename: RESOURCE-TRAIN.json
  check_val_every_n_epoch: 1000
  limit_val_batches: 1
