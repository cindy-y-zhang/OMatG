# Stage 1 go/no-go overlay: MP-20 at reduced budget.
#
# Applied on top of base_mpts52.yaml, which supplies the denoiser, optimiser and everything else the arms must share,
# and after the arm overlay, whose group-file paths this file has to redirect away from MPTS-52:
#
#   python -m cgfm.main fit --config cgfm/configs/base_mpts52.yaml --config cgfm/configs/arm_kmedoids.yaml \
#       --config cgfm/configs/sweep_mp20.yaml
#
# MP-20 is the decisive half of the sweep. Its structures run up to twenty atoms, so the shared per-structure group
# count leaves real room between the group centroids and the internal geometry, and the hyperparameters inherited from
# base_mpts52.yaml were tuned on this dataset rather than transferred to it. If no eta beats the atomwise arm here, the
# kill criterion in the plan says not to scale to MPTS-52.

model:
  dataset_name: "mp_20"
  sampler:
    class_path: omg.sampler.IndependentSampler
    init_args:
      pos_distribution:
        class_path: omg.sampler.position_distributions.UniformPositionDistribution
      cell_distribution:
        class_path: omg.sampler.cell_distributions.InformedLatticeDistribution
        init_args:
          dataset_name: mp_20
      species_distribution:
        class_path: omg.sampler.species_distributions.MirrorSpecies

data:
  train_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "data/mp_20/train.lmdb"
      lazy_storage: True
      niggli_reduce: False
  val_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "data/mp_20/val.lmdb"
      lazy_storage: True
      niggli_reduce: False
  pred_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "data/mp_20/test.lmdb"
      lazy_storage: True
      niggli_reduce: False
  train_group_file: "cgfm/groups/mp_20/train.kmedoids.npz"
  val_group_file: "cgfm/groups/mp_20/val.kmedoids.npz"

trainer:
  # Keep CSV logs for the local go/no-go table and mirror every metric to Weights & Biases.
  logger:
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: "."
        name: ""
    - class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        project: "cgfm-s1"
        entity: "cindyz"
        save_dir: "."
        log_model: false
  # A fifth of the full schedule. This decides whether to spend the MPTS-52 budget, not what to report.
  max_epochs: 400
  check_val_every_n_epoch: 25
  # MP-20 has 27 training batches per epoch, so the default interval of 50 would suppress step metrics.
  log_every_n_steps: 10
