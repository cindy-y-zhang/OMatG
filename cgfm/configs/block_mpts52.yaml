# Shared protocol for the MPTS-52 rigid-block experiment.
#
#   python -m cgfm.block_main fit --config cgfm/configs/block_mpts52.yaml \
#       --config cgfm/configs/block_oracle_mpts52.yaml
#
# Oracle and joint overlays change only the CN interpolant and the sampler. Architecture, optimiser, batch, epoch
# count, validation cadence and matching tolerances are identical, and identical to the atomwise baseline.

seed_everything: 0

model:
  si:
    class_path: cgfm.block_si.CoupledBlockInterpolants
    init_args:
      cn_mode: joint
      integration_time_steps: 210
      pos_annealing_factor: 10.182659004291072
      rot_annealing_factor: 10.182659004291072
      cell_annealing_factor: 1.824475401606087
      discrete_noise: 0.0
  relative_si_costs:
    species_loss: 0.0
    block_type_loss: 0.05
    pos_loss_b: 0.474707467
    rot_loss_b: 0.474707467
    cell_loss_b: 0.000585066
  sampler:
    class_path: cgfm.block_sampler.BlockSampler
    init_args:
      cn_mode: joint
      pos_distribution:
        class_path: omg.sampler.position_distributions.UniformPositionDistribution
      cell_distribution:
        class_path: omg.sampler.cell_distributions.InformedLatticeDistribution
        init_args:
          dataset_name: mpts_52
  model:
    class_path: omg.model.model.Model
    init_args:
      encoder:
        class_path: cgfm.block_encoder.BlockCSPNet
      head:
        class_path: omg.model.heads.pass_through.PassThrough
      time_embedder:
        class_path: omg.model.model_utils.SinusoidalTimeEmbeddings
        init_args:
          dim: 256
  consensus_weight: 0.0
  use_min_perm_dist: False
  float_32_matmul_precision: "high"
  validation_mode: "match_rate"
  dataset_name: "mpts_52"
  number_cpus: 8

data:
  train_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "omg/data/mpts_52/train.lmdb"
      lazy_storage: True
      niggli_reduce: False
  val_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "omg/data/mpts_52/val.lmdb"
      lazy_storage: True
      niggli_reduce: False
  pred_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "omg/data/mpts_52/test.lmdb"
      lazy_storage: True
      niggli_reduce: False
  block_dir: "cgfm/blocks/mpts_52"
  batch_size: 256
  num_workers: 6
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4

trainer:
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: "runs-blocks/mpts52/joint"
      name: ""
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "best_match_rate"
        save_top_k: 1
        monitor: "match_rate"
        mode: "max"
        save_weights_only: false
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "last"
        save_top_k: 1
        every_n_epochs: 25
        save_weights_only: false
  accumulate_grad_batches: 4
  gradient_clip_val: 0.5
  num_sanity_val_steps: 0
  precision: "32-true"
  max_epochs: 400
  max_time:
    hours: 28
  check_val_every_n_epoch: 25
  enable_progress_bar: true

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0006689636445843722
