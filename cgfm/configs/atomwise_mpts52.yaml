# Atomwise MPTS-52 baseline: the reference the rigid-block model has to beat.
#
#   omg fit --config cgfm/configs/atomwise_mpts52.yaml \
#       --trainer.logger.init_args.save_dir runs-blocks/mpts52/atomwise
#
# The repository has no MPTS-52 baseline, and every claim the block experiment can make is a comparison against one, so
# it is trained here rather than quoted from a paper. Published MPTS-52 numbers come from different splits, different
# matching tolerances and different sampling budgets, and a win measured against one of those would not be a win.
#
# This is the same model, sampler, optimiser and schedule as cgfm/configs/base_mpts52.yaml, and the same probability
# path. It is written against plain omg rather than cgfm.main for one reason: CGDataModule requires a precomputed group
# file for every split, MPTS-52 has none, and computing 32,000 structures' worth of CrystalNN groups to hand the
# atomwise arm a file it is documented to ignore would be an hour of CPU spent on nothing. The interpolants below are
# what cgfm.arms.ArmStochasticInterpolants builds for grouping_kind "none" and eta 0, which cgfm/tests/test_interpolant.py
# asserts is OMatG's periodic linear path bit for bit.
#
# The denoiser, integrator, annealing factors, optimiser and batch size come from OMatG's tuned crystal-structure-
# prediction configuration omg/conf_examples/csp_linear_ode_mp_20.yaml, which was tuned on MP-20. Both this baseline and
# the block model inherit that bias identically, so the comparison between them holds; the absolute number should not be
# read as a tuned MPTS-52 result.

seed_everything: 0

model:
  si:
    class_path: omg.si.stochastic_interpolants.StochasticInterpolants
    init_args:
      stochastic_interpolants:
        # Chemical species are given, so they are carried through unchanged.
        - class_path: omg.si.single_stochastic_interpolant_identity.SingleStochasticInterpolantIdentity
        # Fractional coordinates.
        - class_path: omg.si.single_stochastic_interpolant.SingleStochasticInterpolant
          init_args:
            interpolant: omg.si.interpolants.PeriodicLinearInterpolant
            gamma: null
            epsilon: null
            differential_equation_type: "ODE"
            integrator_kwargs:
              method: "euler"
            velocity_annealing_factor: 10.182659004291072
            correct_center_of_mass_motion: true
        # Lattice vectors.
        - class_path: omg.si.single_stochastic_interpolant.SingleStochasticInterpolant
          init_args:
            interpolant: omg.si.interpolants.LinearInterpolant
            gamma: null
            epsilon: null
            differential_equation_type: "ODE"
            integrator_kwargs:
              method: "euler"
            velocity_annealing_factor: 1.824475401606087
            correct_center_of_mass_motion: false
      data_fields:
        - "species"
        - "pos"
        - "cell"
      integration_time_steps: 210
  relative_si_costs:
    species_loss: 0.0
    pos_loss_b: 0.9994149341846618
    cell_loss_b: 0.0005850658153382233
  sampler:
    class_path: omg.sampler.IndependentSampler
    init_args:
      pos_distribution:
        class_path: omg.sampler.position_distributions.UniformPositionDistribution
      cell_distribution:
        class_path: omg.sampler.cell_distributions.InformedLatticeDistribution
        init_args:
          dataset_name: mpts_52
      species_distribution:
        class_path: omg.sampler.species_distributions.MirrorSpecies
  model:
    class_path: omg.model.model.Model
    init_args:
      encoder:
        class_path: omg.model.encoders.cspnet_full.CSPNetFull
      head:
        class_path: omg.model.heads.pass_through.PassThrough
      time_embedder:
        class_path: omg.model.model_utils.SinusoidalTimeEmbeddings
        init_args:
          dim: 256
  use_min_perm_dist: False
  float_32_matmul_precision: "high"
  # One structure per validation composition, so match_rate is the one-shot match rate, which is the headline number.
  # Checkpoints are selected on it rather than on the training loss, which is not comparable across parameterisations:
  # the block model's loss is over poses and is not on the same scale as a loss over atom positions.
  validation_mode: "match_rate"
  dataset_name: "mpts_52"
  # Left below the core count so that the block preprocessing can run on the same machine without starving the matcher.
  number_cpus: 8

data:
  train_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "data/mpts_52/train.lmdb"
      lazy_storage: True
      niggli_reduce: False
  val_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "data/mpts_52/val.lmdb"
      lazy_storage: True
      niggli_reduce: False
  pred_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "data/mpts_52/test.lmdb"
      lazy_storage: True
      niggli_reduce: False
  # CSPNet connects every atom of a structure to every other, so activation memory grows with the sum of the squared
  # atom counts, not with the atom count. MPTS-52 averages 24.2 atoms against MP-20's 10.4, which is over five times the
  # edges per structure, and the MP-20 batch of 1024 exhausts 95 GB here. The batch is cut by four and recovered by
  # accumulation below, so the effective batch, and with it the tuned learning rate, is the one this was tuned at.
  batch_size: 256
  num_workers: 6
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4

trainer:
  # Pinned rather than left to Lightning's default, which would pick tensorboardX and write binary event files that
  # cgfm/scripts/collect_results.py cannot read.
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: "runs-blocks/mpts52/atomwise"
      name: ""
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "best_match_rate"
        save_top_k: 1
        monitor: "match_rate"
        mode: "max"
        save_weights_only: false
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "last"
        save_top_k: 1
        every_n_epochs: 25
        save_weights_only: false
  # Restores the effective batch of 1024 that the learning rate below was tuned at. Lightning scales the loss by the
  # reciprocal before the backward pass, so the accumulated gradient is the one a single batch of 1024 would produce.
  accumulate_grad_batches: 4
  gradient_clip_val: 0.5
  num_sanity_val_steps: 0
  precision: "32-true"
  # MPTS-52 holds as many structures as MP-20 but well over twice the atoms each, and CSPNet builds a fully connected
  # graph per structure, so an epoch costs several times what an MP-20 epoch does. The budget is set here and the block
  # model is trained to the same number of epochs, since a comparison at unequal budgets says nothing.
  max_epochs: 400
  max_time:
    hours: 28
  # Validation generates and structure-matches the whole 5,000 structure split, which is far too expensive per epoch.
  check_val_every_n_epoch: 25
  enable_progress_bar: true

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0006689636445843722
